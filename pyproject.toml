[project]
name = "filmspotting"
version = "0.1.0"
description = "Bot para extraer y editar fotogramas de películas, series y anime"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pysubs2>=1.7",
    "pillow>=10.4",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "guessit>=3.8",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langsmith>=0.1",
]

[project.optional-dependencies]
ollama = ["langchain-ollama>=0.3"]

[project.scripts]
filmspotting = "filmspotting.cli:app"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filmspotting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
